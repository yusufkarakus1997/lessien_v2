# MOCK ONLY. Geometry values are injected from the same launch arguments as Xacro.
/lessien_mock/controller_manager:
  ros__parameters:
    update_rate: 50
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    diff_drive_controller:
      type: diff_drive_controller/DiffDriveController
/lessien_mock/joint_state_broadcaster:
  ros__parameters:
    use_local_topics: false
/lessien_mock/diff_drive_controller:
  ros__parameters:
    left_wheel_names: [front_left_wheel_joint, rear_left_wheel_joint]
    right_wheel_names: [front_right_wheel_joint, rear_right_wheel_joint]
    position_feedback: false
    open_loop: false
    odom_frame_id: odom
    base_frame_id: base_footprint
    tf_frame_prefix_enable: true
    tf_frame_prefix: lessien_mock
    enable_odom_tf: true
    publish_rate: 50.0
    cmd_vel_timeout: 0.5
    velocity_rolling_window_size: 1
    publish_limited_velocity: true
    # Mock-only speed limits; not hardware safety limits.
    linear.x.max_velocity: 0.3
    linear.x.min_velocity: -0.3
    angular.z.max_velocity: 1.0
    angular.z.min_velocity: -1.0
